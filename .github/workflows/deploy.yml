name: Deploy Automático - BarberAdmin

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy BarberAdmin na VPS Oracle
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_HOST != '' }}
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            DOCKER_PREFIX=""
            if ! docker ps >/dev/null 2>&1; then
              if sudo docker ps >/dev/null 2>&1; then
                DOCKER_PREFIX="sudo "
              fi
            fi
            DOCKER_CMD="${DOCKER_PREFIX}docker compose"
            DOCKER_CLI="${DOCKER_PREFIX}docker"

            if [ -d "/home/ubuntu/projects/BarberAdmin" ]; then
              cd "/home/ubuntu/projects/BarberAdmin"
            elif [ -d "$HOME/BarberAdmin" ]; then
              cd "$HOME/BarberAdmin"
            else
              cd "$(find /home /var/www /root -maxdepth 3 -name BarberAdmin 2>/dev/null | head -n 1)"
            fi

            git fetch origin main
            git reset --hard origin/main
            mkdir -p uploads/avatars
            chmod -R 777 uploads 2>/dev/null || sudo chmod -R 777 uploads 2>/dev/null || true
            $DOCKER_CMD up -d --build postgres backend frontend

            $DOCKER_CLI network disconnect barberadmin_barber_admin_network barber_man_frontend 2>/dev/null || true
            $DOCKER_CLI network disconnect barberadmin_barber_admin_network barber_man_backend 2>/dev/null || true

            $DOCKER_CLI network connect barbernotify_barber_man_network barber_admin_backend 2>/dev/null || true
            $DOCKER_CLI network connect barbernotify_barber_man_network barber_admin_frontend 2>/dev/null || true

            $DOCKER_CLI exec barber_man_frontend nginx -s reload 2>/dev/null || $DOCKER_CLI restart barber_man_frontend
            echo "Deploy do BarberAdmin concluído com sucesso!"
