services:
  # ==========================================
  # Banco de Dados Relacional - PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: barber_admin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-barberadmin_db}
      POSTGRES_USER: ${DB_USER:-barberadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barberadmin_secret_2026}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-barberadmin} -d ${DB_NAME:-barberadmin_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - barber_admin_network

  # ==========================================
  # Adminer - Gerenciador Web do Banco de Dados
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: barber_admin_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - barber_admin_network

volumes:
  postgres_data:
    driver: local

networks:
  barber_admin_network:
    driver: bridge
