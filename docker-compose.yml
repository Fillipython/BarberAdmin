services:
  # ==========================================
  # Banco de Dados Relacional - PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: barber_admin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-barberadmin_db}
      POSTGRES_USER: ${DB_USER:-barberadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barberadmin_secret_2026}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-barberadmin} -d ${DB_NAME:-barberadmin_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - barber_admin_network

  # ==========================================
  # Backend - Spring Boot 3 (Java 21)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barber_admin_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - DB_HOST=barber_admin_postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-barberadmin_db}
      - DB_USER=${DB_USER:-barberadmin}
      - DB_PASSWORD=${DB_PASSWORD:-barberadmin_secret_2026}
      - BACKEND_PORT=8080
      - UPLOAD_DIR=/app/uploads
      - BARBERNOTIFY_API_KEY=${BARBERNOTIFY_API_KEY:-barbernotify_secret_token_2026}
      - BARBERNOTIFY_WEBHOOK_SECRET=${BARBERNOTIFY_WEBHOOK_SECRET:-barbernotify_webhook_secret_2026}
      - TZ=${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - barber_admin_network

  # ==========================================
  # Frontend - Vue 3 + Vite
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: barber_admin_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8080}
    networks:
      - barber_admin_network

  # ==========================================
  # Nginx Reverse Proxy (SSL / HTTPS)
  # Atende https://fillipython.ddns.net/BarberAdmin/
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: barber_admin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - barber_admin_network

volumes:
  postgres_data:
    driver: local

networks:
  barber_admin_network:
    driver: bridge
