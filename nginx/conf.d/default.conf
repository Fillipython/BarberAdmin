server {
    listen 80;
    listen [::]:80;
    server_name fillipython.ddns.net localhost 127.0.0.1;

    # Redireciona HTTP para HTTPS para atender exatamente o link pedido
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fillipython.ddns.net localhost 127.0.0.1;

    ssl_certificate /etc/nginx/certs/fillipython.crt;
    ssl_certificate_key /etc/nginx/certs/fillipython.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Redirecionamento da raiz para a aplicação BarberAdmin
    location = / {
        return 301 /BarberAdmin/;
    }

    # Frontend Vue 3 + Vite
    location /BarberAdmin/ {
        proxy_pass http://frontend:5173/BarberAdmin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Spring Boot 3
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI Docs
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }
}
